<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscrição Confirmada | Programa de Estágio Sotreq</title>

<style>
:root{
    --sotreq-yellow:#FFD100;
    --sotreq-black:#1F1F1F;
    --sotreq-gray:#F4F4F4;
    --sotreq-darkgray:#666666;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:var(--sotreq-gray);
    color:#333;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.card{
    background:white;
    max-width:550px;
    width:100%;
    padding:40px;
    border-radius:12px;
    box-shadow:0 4px 20px rgba(0,0,0,.1);
    text-align:center;
    border-top:8px solid var(--sotreq-yellow);
}

.icon{
    width:70px;
    height:70px;
    background:var(--sotreq-yellow);
    color:var(--sotreq-black);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:36px;
    font-weight:bold;
    margin:0 auto 20px auto;
}

h1{
    color:var(--sotreq-black);
    font-size:1.8rem;
    margin-bottom:15px;
}

p{
    color:var(--sotreq-darkgray);
    line-height:1.6;
    margin-bottom:25px;
}

.btn{
    display:inline-block;
    background:var(--sotreq-black);
    color:white;
    text-decoration:none;
    padding:12px 30px;
    border-radius:8px;
    font-weight:bold;
    transition:.3s;
}

.btn:hover{
    background:#333;
}
</style>
</head>

<body>

<div class="card">
    <div class="icon">✓</div>
    <h1>Inscrição Recebida!</h1>
    <p>Obrigado por se inscrever no <strong>Programa de Estágio Sotreq</strong>. Suas informações foram enviadas com sucesso e nossa equipe analisará o seu perfil.</p>
    <a href="https://estagiosotreq.site/" class="btn">Voltar ao Início</a>
</div>

</body>
</html>
