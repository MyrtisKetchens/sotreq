<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Programa de Estágio Sotreq | Barra da Tijuca</title>

<style>

:root{
    --sotreq-yellow:#FFD100;
    --sotreq-black:#1F1F1F;
    --sotreq-gray:#F4F4F4;
    --sotreq-darkgray:#666666;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:var(--sotreq-gray);
    color:#333;
}

.header{
    background:var(--sotreq-black);
    border-top:8px solid var(--sotreq-yellow);
    color:white;
    padding:40px;
    text-align:center;
}

.header h1{
    font-size:2rem;
    margin-bottom:10px;
}

.header p{
    color:#ddd;
}

.container{
    max-width:900px;
    margin:40px auto;
    background:white;
    padding:40px;
    border-radius:12px;
    box-shadow:0 4px 20px rgba(0,0,0,.1);
}

.section{
    margin-bottom:35px;
}

.section h2{
    color:var(--sotreq-black);
    border-left:6px solid var(--sotreq-yellow);
    padding-left:12px;
    margin-bottom:20px;
}

.form-group{
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #d8d8d8;
    border-radius:8px;
}

textarea{
    min-height:120px;
    resize:vertical;
}

.checkbox-group{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:10px;
}

.checkbox-group label{
    font-weight:normal;
}

button{
    background:var(--sotreq-yellow);
    color:black;
    border:none;
    padding:15px 35px;
    border-radius:8px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#e6bc00;
}

.footer{
    text-align:center;
    color:var(--sotreq-darkgray);
    margin-top:30px;
}

</style>
</head>

<body>

<div class="header">
    <h1>Programa de Estágio Sotreq</h1>
    <p>Barra da Tijuca | Engenharias e Áreas Correlatas</p>
</div>

<div class="container">

<form action="https://formsubmit.co/ricardo.esposito@outlook.com.br" method="POST" enctype="multipart/form-data">
    <input type="hidden" name="_subject" value="Nova inscrição - Programa de Estágio Sotreq">
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_template" value="table">
    <input type="hidden" name="_next" value="https://estagiosotreq.site/obrigado.html">
    
    <div class="section">
        <h2>Dados Pessoais</h2>

        <div class="form-group">
            <label>Nome Completo</label>
            <input type="text" name="nome" required>
        </div>

        <div class="form-group">
            <label>E-mail</label>
            <input type="email" name="email" required>
        </div>

        <div class="form-group">
            <label>Telefone / WhatsApp</label>
            <input type="tel" name="telefone" required>
        </div>

        <div class="form-group">
            <label>Cidade e Bairro</label>
            <input type="text" name="cidade_bairro">
        </div>

        <div class="form-group">
            <label>LinkedIn (Opcional)</label>
            <input type="url" name="linkedin">
        </div>
    </div>

    <div class="section">
        <h2>Formação Acadêmica</h2>

        <div class="form-group">
            <label>Instituição de Ensino</label>
            <input type="text" name="instituicao">
        </div>

        <div class="form-group">
            <label>Curso</label>
            <select name="curso">
                <option value="">Selecione</option>
                <option value="Engenharia Mecânica">Engenharia Mecânica</option>
                <option value="Engenharia de Produção">Engenharia de Produção</option>
                <option value="Engenharia Elétrica">Engenharia Elétrica</option>
                <option value="Engenharia Civil">Engenharia Civil</option>
                <option value="Engenharia de Controle e Automação">Engenharia de Controle e Automação</option>
                <option value="Engenharia Ambiental">Engenharia Ambiental</option>
                <option value="Engenharia da Computação">Engenharia da Computação</option>
                <option value="Administração">Geografia</option>
                <option value="Logística">Geologia</option>
                <option value="Logística">Tecnologia da Informação</option>
                <option value="Logística">Ciência da Computação</option>
                <option value="Logística">Análise e Desenvolvimento de Sistemas (ADS)</option>
                <option value="Outro">Outro</option>
            </select>
        </div>

        <div class="form-group">
            <label>Período Atual</label>
            <select name="periodo">
                <option value="2º ao 4º">2º ao 4º</option>
                <option value="5º ao 6º">5º ao 6º</option>
                <option value="7º ao 8º">7º ao 8º</option>
                <option value="9º ou superior">9º ou superior</option>
            </select>
        </div>

        <div class="form-group">
            <label>Previsão de Formatura</label>
            <input type="month" name="previsao_formatura">
        </div>
    </div>

    <div class="section">
        <h2>Áreas de Interesse</h2>

        <div class="checkbox-group">
            <label><input type="checkbox" name="area_interesse[]" value="Manutenção"> Manutenção</label>
            <label><input type="checkbox" name="area_interesse[]" value="Operações"> Operações</label>
            <label><input type="checkbox" name="area_interesse[]" value="Engenharia de Serviços"> Engenharia de Serviços</label>
            <label><input type="checkbox" name="area_interesse[]" value="Planejamento"> Planejamento</label>
            <label><input type="checkbox" name="area_interesse[]" value="Projetos"> Projetos</label>
            <label><input type="checkbox" name="area_interesse[]" value="Logística"> Logística</label>
            <label><input type="checkbox" name="area_interesse[]" value="Qualidade"> Qualidade</label>
            <label><input type="checkbox" name="area_interesse[]" value="Melhoria Contínua"> Melhoria Contínua</label>
            <label><input type="checkbox" name="area_interesse[]" value="Comercial Técnico"> Comercial Técnico</label>
        </div>
    </div>

    <div class="section">
        <h2>Conhecimentos</h2>

        <div class="form-group">
            <label>Nível de Excel</label>
            <select name="nivel_excel">
                <option value="Básico">Básico</option>
                <option value="Intermediário">Intermediário</option>
                <option value="Avançado">Avançado</option>
            </select>
        </div>

        <div class="checkbox-group">
            <label><input type="checkbox" name="ferramentas[]" value="Power BI"> Power BI</label>
            <label><input type="checkbox" name="ferramentas[]" value="SAP"> SAP</label>
            <label><input type="checkbox" name="ferramentas[]" value="AutoCAD"> AutoCAD</label>
            <label><input type="checkbox" name="ferramentas[]" value="MS Project"> MS Project</label>
            <label><input type="checkbox" name="ferramentas[]" value="Power Apps"> Power Apps</label>
        </div>

        <br>

        <div class="form-group">
            <label>Descreva um projeto ou atividade relevante que desenvolveu durante sua formação.</label>
            <textarea name="projeto_relevante"></textarea>
        </div>
    </div>

    <div class="section">
        <h2>Perfil Profissional</h2>

        <div class="checkbox-group">
            <label><input type="checkbox" name="perfil[]" value="Proatividade"> Proatividade</label>
            <label><input type="checkbox" name="perfil[]" value="Trabalho em Equipe"> Trabalho em Equipe</label>
            <label><input type="checkbox" name="perfil[]" value="Organização"> Organização</label>
            <label><input type="checkbox" name="perfil[]" value="Comunicação"> Comunicação</label>
            <label><input type="checkbox" name="perfil[]" value="Capacidade Analítica"> Capacidade Analítica</label>
            <label><input type="checkbox" name="perfil[]" value="Adaptabilidade"> Adaptabilidade</label>
        </div>

        <br>

        <div class="form-group">
            <label>Conte uma situação em que você precisou resolver um problema ou superar um desafio.</label>
            <textarea name="desafio_superado"></textarea>
        </div>
    </div>

    <div class="section">
        <h2>Disponibilidade</h2>

        <div class="form-group">
            <label>Possui disponibilidade para atuar presencialmente na Barra da Tijuca?</label>
            <select name="disponibilidade_presencial">
                <option value="Sim">Sim</option>
                <option value="Não">Não</option>
            </select>
        </div>

        <div class="form-group">
            <label>Disponibilidade diária para estágio</label>
            <select name="horas_diarias">
                <option value="4 horas">4 horas</option>
                <option value="6 horas">6 horas</option>
            </select>
        </div>
    </div>

    <div class="section">
        <h2>Sobre a Sotreq</h2>

        <div class="form-group">
            <label>Por que deseja estagiar na Sotreq?</label>
            <textarea name="motivo_sotreq"></textarea>
        </div>

        <div class="form-group">
            <label>O que espera aprender e desenvolver durante o estágio?</label>
            <textarea name="expectativa_aprendizado"></textarea>
        </div>
    </div>

    <div class="section">
        <h2>Currículo</h2>

        <div class="form-group">
            <label>Anexar Currículo (PDF)</label>
            <input type="file" name="attachment" accept=".pdf">
        </div>
    </div>

    <div class="section">
        <label>
            <input type="checkbox" name="termos_lgpd" value="Aceito" required>
            Autorizo o tratamento dos meus dados para fins de participação no processo seletivo da Sotreq.
        </label>
    </div>

    <button type="submit">Enviar Inscrição</button>

</form>

<div class="footer">
    © Programa de Estágio Sotreq
</div>

</div>

</body>
</html>
